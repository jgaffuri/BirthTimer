<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your age by seconds, minutes, hours, days, weeks and months, and celebrate your next birth-X milestones." />
  <meta name="keywords" content="Birthday, anniversary, time, age, milestone, calendar, duration" />
  <meta property="og:title" content="Happy birth-X!" />
  <meta property="og:description" content="Track your age in time units and celebrate your next birth-X milestones." />
  <meta property="og:image" content="https://www.ahahah.eu/birthtimer/img/logo/logo.png" />
  <link rel="canonical" href="https://www.ahahah.eu/birthtimer/" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
  <title>BirthTimer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="header-confetti" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="container">
      <h1><a href="https://www.ahahah.eu/birthtimer/"><span id="title">My next birthdays, from seconds to years</span></a></h1>
      <p id="intro" class="intro">Why celebrate birthdays only once a year?</p>
      <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">Use dark theme</button>
    </div>
  </header>

  <main class="container">
    <section class="panel" id="birthdate">
      <div class="field-row">
        <label for="dateInput" id="birthdateLabel">My birth date:</label>
        <input type="date" id="dateInput" aria-label="Birth date">
      </div>
      <div class="field-row">
        <label for="timeInput" id="atLabel">at</label>
        <input type="time" id="timeInput" aria-label="Birth time">
      </div>
    </section>

    <section class="panel" id="age">
      <h2 id="myAge">My age</h2>
      <ul id="durationList" class="stat-list"></ul>
    </section>

    <section class="panel" id="xiversaires">
      <h2 id="myNextMilestones">My next birth-Xs</h2>
      <ol id="timeline" class="timeline" aria-label="Upcoming milestone timeline"></ol>
      <div class="filters" id="filters" aria-label="Milestone filters"></div>
    </section>

    <section class="panel share-panel" id="share">
      <h2 id="shareTitle">Share and save</h2>
      <div class="share-actions">
        <button id="nativeShareButton" class="action-button" type="button">Share</button>
        <button id="copyLinkButton" class="action-button secondary" type="button">Copy link</button>
      <a href="javascript:void(0);" id="icalButton" class="share-button" aria-label="Add to calendar" title="Add to calendar">
        <img src="img/ical.png" alt="">
      </a>
      <a href="javascript:void(0);" id="share-facebook" class="share-button" aria-label="Share on Facebook" title="Share on Facebook">
        <img src="img/fb.png" alt="">
      </a>
      <a href="javascript:void(0);" id="share-whatsapp" class="share-button" aria-label="Share on WhatsApp" title="Share on WhatsApp">
        <img src="img/whatsapp.png" alt="">
      </a>
      <a href="javascript:void(0);" id="share-linkedin" class="share-button" aria-label="Share on LinkedIn" title="Share on LinkedIn">
        <img src="img/linkedin.png" alt="">
      </a>
      <a href="javascript:void(0);" id="share-twitter" class="share-button" aria-label="Share on Twitter/X" title="Share on Twitter/X">
        <img src="img/x.svg" alt="">
      </a>
      <a href="javascript:void(0);" id="share-telegram" class="share-button" aria-label="Share on Telegram" title="Share on Telegram">
        <img src="img/telegram.svg" alt="">
      </a>
      <button id="share-tiktok" class="share-button" type="button" aria-label="Share on TikTok" title="Share on TikTok">
        <img src="img/tiktok.svg" alt="">
      </button>
      </div>
      <p id="shareStatus" class="share-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <div id="icsDialog" class="ics-dialog" role="dialog" aria-modal="true" aria-labelledby="icsDialogTitle" aria-hidden="true">
    <div class="ics-dialog-card">
      <h3 id="icsDialogTitle">Who is this for?</h3>
      <input type="text" id="personNameInput" value="Me" aria-label="Person name for calendar entry">
      <div class="dialog-actions">
        <button id="validateBtn" type="button">Validate</button>
        <button id="cancelBtn" type="button" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2026 <a href="https://www.ahahah.eu/birthtimer/">BirthTimer</a></p>
  </footer>
</body>

</html>
